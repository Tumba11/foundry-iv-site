<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry IV</title>
<meta name="description" content="Foundry IV builds AI game development for the casino floor, and AI solutions for executives and brands.">
<meta property="og:title" content="Foundry IV">
<meta property="og:description" content="Two doors. AI game development for the casino floor, and AI solutions for executives and brands.">
<script>
(function(){
  var raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return;
  var id = raw.toLowerCase();
  var consult = {consulting:'consulting.html', 'consult-cta':'consulting.html#consult-cta'};
  if (consult[id]) { location.replace(consult[id]); return; }
  var alias = {advisors:'advisory', advisor:'advisory'};
  var target = alias[id] || raw;
  var games = {top:1, problem:1, what:1, why:1, said:1, team:1, advisory:1};
  if (games[target.toLowerCase()]) location.replace('games.html#' + target);
})();
</script>
<link rel="canonical" href="https://foundry-iv.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://foundry-iv.com/">
<meta property="og:image" content="https://foundry-iv.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="Foundry IV">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Foundry IV">
<meta name="twitter:description" content="Foundry IV builds AI game development for the casino floor, and AI solutions for executives and brands.">
<meta name="twitter:image" content="https://foundry-iv.com/assets/og-image.jpg">
<meta name="theme-color" content="#08090d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d; --bg2:#0c0e14; --card:#141722; --line:#232838;
    --text:#eef0f6; --muted:#9aa1b5; --gold:#e8b34a; --gold2:#ffd27a; --cyan:#3fd6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.1;letter-spacing:-.02em}
  a{color:inherit}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  nav{position:relative;z-index:10;height:68px;background:rgba(8,9,13,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex:0 0 68px}
  nav .bar{height:68px;display:flex;align-items:center;justify-content:center;padding:0 24px}
  .logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:.06em;text-decoration:none}
  .logo span{color:var(--gold)}

  .page{min-height:100dvh;min-height:100vh;display:flex;flex-direction:column}

  .doors{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;transition:grid-template-columns .7s ease}
  .doors:has(.door-games:hover),
  .doors:has(.door-games:focus-visible){grid-template-columns:1.12fr .88fr}
  .doors:has(.door-consult:hover),
  .doors:has(.door-consult:focus-visible){grid-template-columns:.88fr 1.12fr}

  .door{position:relative;overflow:hidden;display:flex;align-items:flex-start;text-decoration:none;color:inherit;min-height:0;isolation:isolate;transition:filter .7s ease}
  .doors:has(.door:hover) .door:not(:hover),
  .doors:has(.door:focus-visible) .door:not(:focus-visible){filter:brightness(.72)}

  .door-visual{position:absolute;inset:0;transition:transform .9s ease}
  .door:hover .door-visual,
  .door:focus-visible .door-visual{transform:scale(1.045)}

  .door-games .door-visual{
    background:#08090d url("assets/door-casino.jpg") no-repeat 62% 50% / cover;
  }
  .door-consult .door-visual{
    background:#08090d url("assets/door-consult.jpg") no-repeat 50% 0% / cover;
    transform-origin:50% 0%;
  }

  .door-shade{position:absolute;inset:0;pointer-events:none}
  .door-games .door-shade{
    background:linear-gradient(180deg,rgba(8,9,13,.90) 0%,rgba(8,9,13,.62) 30%,rgba(8,9,13,.18) 52%,rgba(8,9,13,.22) 100%);
  }
  .door-consult .door-shade{
    background:linear-gradient(180deg,rgba(8,9,13,.90) 0%,rgba(8,9,13,.55) 24%,rgba(8,9,13,.16) 36%,rgba(8,9,13,0) 44%,rgba(8,9,13,.10) 100%);
  }
  .door-copy p{text-shadow:0 1px 14px rgba(8,9,13,.85)}

  .door + .door{border-left:1px solid rgba(232,179,74,.35)}

  .door-copy{position:relative;z-index:2;padding:48px 48px 40px;max-width:560px;transition:opacity .5s ease}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  .eyebrow i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .pill{display:inline-block;border:1px solid rgba(232,179,74,.45);color:var(--gold);border-radius:999px;padding:5px 12px;letter-spacing:.12em;background:rgba(232,179,74,.10);font-size:.7rem;font-weight:700;text-transform:uppercase;margin-bottom:18px}
  .door h2{font-size:clamp(2rem,3.4vw,3.15rem);font-weight:700;max-width:14ch;margin:0 0 16px;color:var(--text)}
  .door-games h2 em{font-style:normal;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .door p{color:var(--muted);font-size:1.05rem;max-width:36ch;margin-bottom:28px}
  .door-cta{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:1px solid rgba(232,179,74,.55);background:rgba(8,9,13,.45);font-weight:600;font-size:.95rem;color:var(--text);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .35s ease,background .35s ease}
  .door-cta span{display:inline-block;transition:transform .35s ease;color:var(--gold)}
  .door:hover .door-cta,
  .door:focus-visible .door-cta{border-color:var(--gold);background:rgba(232,179,74,.16)}
  .door:hover .door-cta span,
  .door:focus-visible .door-cta span{transform:translateX(5px)}

  .door:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;z-index:3}

  @media (max-width:720px){
    .doors{grid-template-columns:1fr;grid-template-rows:auto auto}
    .doors:has(.door-games:hover),
    .doors:has(.door-games:focus-visible),
    .doors:has(.door-consult:hover),
    .doors:has(.door-consult:focus-visible){grid-template-columns:1fr}
    .doors:has(.door:hover) .door:not(:hover),
    .doors:has(.door:focus-visible) .door:not(:focus-visible){filter:none}
    .door{min-height:78vh}
    .door + .door{border-left:none;border-top:1px solid rgba(232,179,74,.35)}
    .door-copy{padding:36px 24px 32px;max-width:none}
    .door h2{max-width:14ch;font-size:clamp(2rem,8vw,2.6rem)}
    .door-games .door-visual{background-position:70% 50%}
    .door-consult .door-visual{background-size:155% auto;background-position:55% 0%}
  }

  @media (prefers-reduced-motion:reduce){
    .doors,.door,.door-visual,.door-cta span{transition:none}
    .door:hover .door-visual,
    .door:focus-visible .door-visual{transform:none}
    .doors:has(.door-games:hover),
    .doors:has(.door-games:focus-visible),
    .doors:has(.door-consult:hover),
    .doors:has(.door-consult:focus-visible){grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="page">
  <nav>
    <div class="bar">
      <a class="logo" href="index.html">FOUNDRY <span>IV</span></a>
    </div>
  </nav>

  <main class="doors">
    <h1 class="sr-only">Foundry IV</h1>

    <a class="door door-games" href="games.html">
      <span class="door-visual" aria-hidden="true"></span>
      <span class="door-shade" aria-hidden="true"></span>
      <span class="door-copy">
        <span class="eyebrow"><i></i>AI game development</span>
        <h2>Video games belong on the <em>casino floor.</em></h2>
        <p>Real video games, made for the casino floor.</p>
        <span class="door-cta">Enter <span aria-hidden="true">&rarr;</span></span>
      </span>
    </a>

    <a class="door door-consult" href="consulting.html">
      <span class="door-visual" aria-hidden="true"></span>
      <span class="door-shade" aria-hidden="true"></span>
      <span class="door-copy">
        <span class="pill">By invitation</span>
        <h2>Building AI solutions for executives and brands.</h2>
        <p>Private work with CEOs, then the company.</p>
        <span class="door-cta">Enter <span aria-hidden="true">&rarr;</span></span>
      </span>
    </a>
  </main>
</div>
</body>
</html>
